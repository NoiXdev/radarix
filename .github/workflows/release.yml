name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — must already exist'
        required: true

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Full history + tags are required for conventional-changelog.
          fetch-depth: 0
          # Releases land on main: no PR / status-check rules protect it, so
          # the default GITHUB_TOKEN can push the CHANGELOG commit directly.
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Generate full CHANGELOG.md
        # This is an Xcode project with no package.json. conventional-changelog
        # labels the newest section with package.json's version, so synthesize
        # a throwaway one from the tag (never committed). TAG comes in via env
        # so untrusted ref names are never interpolated into script text.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          printf '{"name":"radarix","version":"%s"}\n' "${TAG#v}" > package.json
          npx -y conventional-changelog-cli@5 -p conventionalcommits -i CHANGELOG.md -s -r 0
          rm -f package.json
          # conventional-changelog can prepend a blank line; drop any leading
          # blank lines so the file always starts at the first version heading.
          sed -i '/./,$!d' CHANGELOG.md

      - name: Extract latest release notes
        # Slice out just the newest version section for the GitHub Release body.
        run: awk '/^#+ \[?v?[0-9]+\.[0-9]+/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Commit CHANGELOG back to main
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Stage first, then check the staged diff: `git diff --quiet` ignores
          # untracked files, so a freshly generated CHANGELOG.md (not yet
          # tracked) would be silently skipped.
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'CHANGELOG.md unchanged — nothing to commit.'
          else
            git commit -m "chore(release): $TAG [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create / update GitHub Release (draft until the DMG is up)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          # `v*.*.*` also matches a pre-release tag like `v1.1.0-beta.1` —
          # flag it so `/latest` never offers a pre-release to stable users.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  build:
    name: Build, sign & notarize (macOS)
    needs: changelog
    outputs:
      # The cask's checksum, read off the DMG this job just notarized rather
      # than recomputed later from a download — the tap verifies it again on
      # its side, so a mismatch here is caught before anything is published.
      sha256: ${{ steps.dmg.outputs.sha256 }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # workflow_dispatch runs from a branch ref; build the TAGGED source
          # either way so a re-dispatch can never ship a moved HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Select the newest installed Xcode
        # Same step as ci.yml; see the comment there. The release must be
        # built by the toolchain the CI gate tested, not by whatever the
        # runner image defaults to. Both versions are printed so they travel
        # with the run.
        shell: bash
        run: |
          set -euo pipefail
          echo "--- runner default ---"
          xcodebuild -version
          swift --version
          latest=$(printf '%s\n' /Applications/Xcode_*.app \
            | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' \
            | sort -V | tail -n 1)
          [ -n "$latest" ] || { echo "::error::no /Applications/Xcode_<version>.app on this runner" >&2; exit 1; }
          echo "selecting $latest"
          sudo xcode-select -s "$latest"
          echo "--- selected ---"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run tests
        # A tag can point at any commit — never sign and ship untested code.
        working-directory: Packages/RadarixKit
        run: swift test

      - name: Import signing certificate
        # The action puts the certificate in a temporary keychain under
        # $RUNNER_TEMP, outside the checkout: scripts/release's signed path
        # refuses a dirty working tree.
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Prepare notarization credentials
        # The .p8 lives in $RUNNER_TEMP, never in the workspace, for the same
        # clean-tree reason as above.
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          {
            echo "APPLE_API_KEY=$KEY_PATH"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple
        # scripts/release picks up the API-key env (CI mode) and the version
        # from the tag; notarization waits on Apple's notary service, which
        # can take several minutes with no output — not a hang. The build
        # number is passed explicitly: a shallow clone would make the
        # script's commit-count fallback useless. `hdiutil create` may print
        # a deprecation warning on new macOS; it is harmless.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RADARIX_BUILD: ${{ github.run_number }}
          RADARIX_OAUTH_CLIENT_ID: ${{ vars.RADARIX_OAUTH_CLIENT_ID }}
        run: |
          RADARIX_VERSION="${TAG#v}" scripts/release

      - name: Clean up notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/apple_api_key.p8"

      - name: Checksum the DMG
        id: dmg
        run: |
          set -uo pipefail
          dmg=$(find dist -maxdepth 1 -name '*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "::error::no DMG in dist/ to checksum" >&2; exit 1; }
          echo "Found $dmg"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG and publish the release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: dist/*.dmg
          draft: false
          # Same pre-release flag as the changelog job's release step above —
          # this step is what actually flips the release out of draft, so it
          # must carry it too.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

  announce:
    name: Announce on Discord
    # After `build`, because that job is what takes the release out of draft;
    # a failed build published nothing, so a skipped announcement is right.
    needs: build
    # Pre-releases are installed from the releases page and not announced.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    uses: ./.github/workflows/announce.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  tap:
    name: Bump the Homebrew cask
    needs: build
    # Homebrew has no concept of a prerelease: whatever lands in the tap is
    # what `brew upgrade` hands every user. Pre-releases therefore skip this
    # and are installed from the releases page instead — the same rule the
    # tap's own README states.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that the cask exists
        # The bump workflow edits an existing cask; it cannot create one. For
        # the very first release the cask is added by hand, so a missing file
        # is expected once and must not turn the release red. Any other
        # error (auth, rate limit, network) is a real failure.
        id: cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -uo pipefail
          if out=$(gh api repos/NoiXdev/homebrew-tap/contents/Casks/radarix.rb 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<< "$out"; then
            echo "::notice::Casks/radarix.rb does not exist in NoiXdev/homebrew-tap yet. The first cask is added by hand; later releases bump it automatically."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not check the tap for Casks/radarix.rb: $out" >&2
            exit 1
          fi

      - name: Dispatch the bump
        if: steps.cask.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          set -uo pipefail
          [ -n "$SHA" ] || { echo "::error::the build job produced no checksum" >&2; exit 1; }
          for attempt in 1 2 3; do
            if gh workflow run bump.yml --repo NoiXdev/homebrew-tap \
              -f kind=cask \
              -f name=radarix \
              -f version="${TAG#v}" \
              -f sha256="$SHA"; then
              echo "Dispatched on attempt $attempt."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed."
            sleep 10
          done
          exit 1

      # This job runs after the release is already public. A silent failure
      # here leaves the tap pointing at the previous version while its README
      # advertises this one, so say exactly what to run by hand. The tap's
      # SETUP.md records this happening to another product on 2026-09-23.
      - name: Explain how to finish the bump by hand
        if: failure()
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SHA: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "::error::The tap was not bumped. The release is already published,"
          echo "::error::so 'brew install --cask radarix' still installs the previous version."
          echo "Run it by hand with a token that may dispatch workflows in the tap:"
          echo ""
          echo "  gh workflow run bump.yml --repo NoiXdev/homebrew-tap \\"
          echo "    -f kind=cask -f name=radarix \\"
          echo "    -f version=${TAG#v} -f sha256=${SHA}"
          echo ""
          echo "A 403 here means TAP_TOKEN cannot dispatch in NoiXdev/homebrew-tap."
          echo "See SETUP.md in that repository for what the token needs."
