<!-- Radarix app icon master, direction C2 (approved 2026-11-24).
     1024 x 1024 canvas on the macOS icon grid: an 824 px continuous-corner squircle
     (corner radius 185.4) centred with a 100 px margin. Navy body, a faint cyan radar
     ring, three cyan nodes connected from the centre, the newest node in amber.
     All three outer nodes sit on the ring (radius 275 around 512,512).
     The AppIcon PNGs are rendered from this file with rsvg-convert. -->
