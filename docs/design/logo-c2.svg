  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3350"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
  </defs>
  <path fill="url(#body)" d="M383.41 100 L640.59 100 C722.19 100 763 100 799.79 112.14 L806.92 113.89 C854.88 131.34 892.66 169.12 910.11 217.08 L911.86 224.21 C924 261 924 301.81 924 383.41 L924 640.59 C924 722.19 924 763 911.86 799.79 L910.11 806.92 C892.66 854.88 854.88 892.66 806.92 910.11 L799.79 911.86 C763 924 722.19 924 640.59 924 L383.41 924 C301.81 924 261 924 224.21 911.86 L217.08 910.11 C169.12 892.66 131.34 854.88 113.89 806.92 L112.14 799.79 C100 763 100 722.19 100 640.59 L100 383.41 C100 301.81 100 261 112.14 224.21 L113.89 217.08 C131.34 169.12 169.12 131.34 217.08 113.89 L224.21 112.14 C261 100 301.81 100 383.41 100 Z"/>
  <!-- radar ring -->
  <circle cx="512" cy="512" r="275" fill="none" stroke="#00b8c8" stroke-width="44" opacity=".4"/>
  <!-- connections from the centre -->
  <path d="M317.55 706.45 L512 512 L706.45 317.55 M512 512 L237 512" fill="none" stroke="#00b8c8" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <circle cx="512" cy="512" r="54" fill="#00b8c8"/>
  <!-- older nodes -->
  <circle cx="317.55" cy="706.45" r="60" fill="#0b1524" stroke="#00b8c8" stroke-width="42"/>
  <circle cx="237" cy="512" r="60" fill="#0b1524" stroke="#00b8c8" stroke-width="42"/>
  <!-- newest node -->
  <circle cx="706.45" cy="317.55" r="90" fill="#f5a524"/>
